[tox]
minversion = 3.10.0
envlist = py310,py311,py312,lint,coverage
isolated_build = true

[gh-actions]
python =
    3.10: py310, lint, coverage
    3.11: py311
    3.12: py312

[testenv]
extras = test
commands = pytest

[testenv:lint]
deps =
    ruff>=0.15.12
commands =
    ruff format --check .
    ruff check .

[testenv:coverage]
extras = test
passenv = CODECOV_TOKEN
commands =
    python -m pytest --cov=air2neo
    codecov

[coverage:run]
omit =
    docs/*
    tests/*
    .venv/*
    .tox/*
