[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[project]
name = "air2neo"
version = "2.2.0"
description = "Airtable to Neo4j"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
]
