[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[project]
name = "air2neo"
version = "2.2.1"
description = "Airtable to Neo4j data ingestor"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "David Lee", email = "leetdavidu@gmail.com" }]
keywords = [
    "airtable",
    "neo4j",
    "pyairtable",
    "job",
    "data",
    "ingestor",
    "air2neo",
    "pipeline",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "neo4j>=5.28.1",
    "pandas>=2.2.3",
    "pyairtable>=3.0.2",
    "pyarrow>=19.0.1",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/bilbyai/air2neo"
Repository = "https://github.com/bilbyai/air2neo"
Issues = "https://github.com/bilbyai/air2neo/issues"

[project.scripts]
air2neo = "air2neo.cli:main"
air2neo-migrate = "air2neo.cli:main"

[project.optional-dependencies]
test = [
    "codecov==2.1.13",
    "mock==5.2.0",
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "requests-mock==1.12.1",
]

[dependency-groups]
dev = [
    "air2neo[test]",
    "ruff>=0.15.12",
    "tox==4.24.2",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.build-backend]
module-name = "air2neo"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "B9", "C90", "E", "F", "T10", "W"]
ignore = ["E203", "E266", "E501"]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
mypy_path = "air2neo"
python_version = "3.10"
warn_return_any = false
warn_unused_configs = false

[tool.pytest.ini_options]
addopts = "-v"
testpaths = [
    "tests",
]
