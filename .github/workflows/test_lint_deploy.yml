name: Test Lint and Deploy

on:
  push:

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run lint
        run: uv run ruff format --check . && uv run ruff check .

      - name: Run tests
        run: uv run pytest --cov=air2neo

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        run: uv run codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: test
    # Publish when a version bump lands on main, or when a v* version tag is pushed.
    # uv's --check-url skips files that already exist on PyPI, so ordinary main
    # pushes with an unchanged version do not fail on duplicate uploads.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Build a binary wheel and a source tarball
        run: uv build --no-sources --sdist --wheel --out-dir dist/

      - name: Publish distribution to PyPI
        run: uv publish --check-url https://pypi.org/simple/air2neo/ dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
